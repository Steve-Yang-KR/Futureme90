databases:
  - name: futureme90-db
    plan: free
    databaseName: futureme90
    user: futureme90

services:
  - type: web
    name: futureme90-v03
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: futureme90-db
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_API_KEY
        sync: false
      - key: TRAINER_EMAILS
        sync: false
